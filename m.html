<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0e1013">
<title>カメラ</title>
<style>
  :root {
    --ac:#a8d4ff;          /* accent: ice blue */
    --acink:#06121f;
    --glass:rgba(18,20,24,.44);
    --line:rgba(255,255,255,.16);
    --mute:#9aa3ad;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  html, body { margin:0; height:100%; background:#0e1013; color:#fff; overflow:hidden; overscroll-behavior:none;
    font-family:ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Hiragino Maru Gothic ProN", "Hiragino Sans", "Noto Sans JP", sans-serif; }
  button { font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; }
  button:focus-visible { outline:2px solid var(--ac); outline-offset:2px; }
  .glass { background:var(--glass); border:1px solid var(--line);
    backdrop-filter:blur(18px) saturate(1.4); -webkit-backdrop-filter:blur(18px) saturate(1.4); }

  /* ---------- full-screen viewfinder ---------- */
  #finder { position:fixed; inset:0; overflow:hidden; background:#0e1013; }
  video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transform-origin:center;
    transform:scaleX(var(--mx,1)) scale(var(--z,1)); }
  .scrim { position:absolute; left:0; right:0; pointer-events:none; }
  .scrim.t { top:0; height:140px; background:linear-gradient(rgba(0,0,0,.45), transparent); }
  .scrim.b { bottom:0; height:260px; background:linear-gradient(transparent, rgba(0,0,0,.55)); }
  .grid { position:absolute; inset:0; pointer-events:none; opacity:0; transition:opacity .2s;
    background:
      linear-gradient(to right, transparent calc(33.33% - .5px), rgba(255,255,255,.35) calc(33.33% - .5px), rgba(255,255,255,.35) calc(33.33% + .5px), transparent calc(33.33% + .5px), transparent calc(66.66% - .5px), rgba(255,255,255,.35) calc(66.66% - .5px), rgba(255,255,255,.35) calc(66.66% + .5px), transparent calc(66.66% + .5px)),
      linear-gradient(to bottom, transparent calc(33.33% - .5px), rgba(255,255,255,.35) calc(33.33% - .5px), rgba(255,255,255,.35) calc(33.33% + .5px), transparent calc(33.33% + .5px), transparent calc(66.66% - .5px), rgba(255,255,255,.35) calc(66.66% - .5px), rgba(255,255,255,.35) calc(66.66% + .5px), transparent calc(66.66% + .5px)); }
  .grid.on { opacity:1; }
  .flash { position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; }
  .flash.go { animation:blink .26s ease-out; }
  @keyframes blink { 0%{opacity:.8} 100%{opacity:0} }

  .focus { position:absolute; width:72px; height:72px; border-radius:22px; border:1.5px solid var(--ac); pointer-events:none; opacity:0;
    transform:translate(-50%,-50%) scale(1.35); }
  .focus.go { animation:focus 1s ease-out; }
  @keyframes focus { 0%{opacity:0; transform:translate(-50%,-50%) scale(1.35)} 15%{opacity:1; transform:translate(-50%,-50%) scale(1)} 75%{opacity:1} 100%{opacity:0; transform:translate(-50%,-50%) scale(1)} }

  .msg { position:absolute; inset:0; display:none; align-items:center; justify-content:center; text-align:center; padding:32px;
    font-size:14px; line-height:1.8; color:var(--mute); background:#0e1013; }
  .msg.show { display:flex; }

  /* ---------- UI layer ---------- */
  .ui { position:fixed; inset:0; pointer-events:none;
    padding:calc(env(safe-area-inset-top,0px) + 10px) 14px calc(env(safe-area-inset-bottom,0px) + 14px); display:flex; flex-direction:column; justify-content:space-between; }
  .ui > * , .ui .top > * { pointer-events:auto; }
  .top { display:flex; align-items:center; justify-content:space-between; pointer-events:none; }
  .pill { height:38px; padding:0 14px; border-radius:19px; display:flex; align-items:center; gap:7px; font-size:13px; font-weight:600; transition:background .2s,color .2s,border-color .2s; }
  .pill svg { width:18px; height:18px; flex:none; }
  .pill.on { background:var(--ac); color:var(--acink); border-color:var(--ac); }
  .pill.static { color:var(--mute); pointer-events:none; }
  .pill.icon { width:38px; padding:0; justify-content:center; }

  .toast { position:absolute; left:50%; top:calc(env(safe-area-inset-top,0px) + 62px); transform:translate(-50%,-6px); padding:8px 14px; border-radius:16px;
    font-size:13px; opacity:0; transition:opacity .25s, transform .25s; pointer-events:none; white-space:nowrap; z-index:5; }
  .toast.show { opacity:1; transform:translate(-50%,0); }

  .bottomwrap { display:flex; flex-direction:column; align-items:center; gap:14px; pointer-events:none; }
  .zoom { display:flex; gap:2px; padding:4px; border-radius:22px; pointer-events:auto; }
  .zoom button { min-width:44px; height:34px; border-radius:17px; font-size:13px; font-weight:600; color:#d5dbe2; transition:all .2s; }
  .zoom button.on { background:var(--ac); color:var(--acink); }

  .dock { width:100%; max-width:440px; height:104px; border-radius:36px; display:flex; align-items:center; justify-content:space-between; padding:0 26px; pointer-events:auto; }
  .thumb { width:56px; height:56px; border-radius:16px; background:rgba(255,255,255,.08) center/cover no-repeat; border:1px solid var(--line); position:relative; }
  .thumb .badge { position:absolute; right:-6px; top:-6px; min-width:21px; height:21px; border-radius:11px; padding:0 6px;
    background:var(--ac); color:var(--acink); font-size:12px; font-weight:700; display:none; align-items:center; justify-content:center; }
  .thumb.has .badge { display:flex; }
  .shutter { width:76px; height:76px; border-radius:50%; border:3px solid rgba(255,255,255,.92); display:flex; align-items:center; justify-content:center; }
  .shutter i { display:block; width:60px; height:60px; border-radius:50%; background:#fff; transition:transform .09s ease-out, background .09s; }
  .shutter:active i { transform:scale(.84); background:var(--ac); }
  .flip { width:56px; height:56px; border-radius:50%; background:rgba(255,255,255,.1); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; }
  .flip svg { width:25px; height:25px; transition:transform .4s; }
  .flip.spin svg { transform:rotate(180deg); }

  /* ---------- gallery / save sheet ---------- */
  .sheet { position:fixed; inset:0; background:#0e1013; z-index:20; display:none; flex-direction:column;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
  .sheet.show { display:flex; }
  .sheet header { flex:0 0 54px; display:flex; align-items:center; justify-content:space-between; padding:0 16px; }
  .sheet header .title { font-weight:600; font-size:16px; }
  .link { color:var(--ac); font-size:15px; padding:10px 4px; }
  .gallery { flex:1; overflow-y:auto; display:grid; grid-template-columns:repeat(3,1fr); gap:3px; align-content:start; padding:0 3px; -webkit-overflow-scrolling:touch; }
  .cell { position:relative; aspect-ratio:3/4; background:#181b20; border-radius:6px; overflow:hidden; }
  .cell img { width:100%; height:100%; object-fit:cover; display:block; }
  .cell .check { position:absolute; right:6px; top:6px; width:26px; height:26px; border-radius:50%; border:2px solid #fff;
    background:rgba(0,0,0,.35); display:flex; align-items:center; justify-content:center; }
  .cell.sel .check { background:var(--ac); border-color:var(--ac); }
  .cell.sel .check::after { content:""; width:6px; height:11px; border:solid var(--acink); border-width:0 2.5px 2.5px 0; transform:rotate(45deg) translate(-1px,-1px); }
  .empty { grid-column:1/-1; text-align:center; color:var(--mute); padding:90px 24px; font-size:14px; line-height:1.8; }
  .hint { text-align:center; color:var(--mute); font-size:12px; padding:8px 16px; line-height:1.6; }
  .savebar { padding:6px 14px 12px; display:flex; gap:10px; }
  .savebar button { flex:1; height:52px; border-radius:26px; font-weight:600; font-size:16px; background:rgba(255,255,255,.1); }
  .savebar button.primary { background:var(--ac); color:var(--acink); }
  .savebar button[disabled] { opacity:.4; }

  .preview { position:fixed; inset:0; background:#000; z-index:30; display:none; align-items:center; justify-content:center; }
  .preview.show { display:flex; }
  .preview img { max-width:100%; max-height:100%; -webkit-touch-callout:default; -webkit-user-select:auto; user-select:auto; }
</style>
</head>
<body>

<div id="finder">
  <video id="video" autoplay playsinline muted></video>
  <div class="scrim t"></div><div class="scrim b"></div>
  <div class="grid" id="grid"></div>
  <div class="flash" id="flash"></div>
  <div class="focus" id="focus"></div>
  <div class="msg" id="msg"></div>
</div>

<div class="ui" id="ui">
  <div class="top">
    <button class="pill glass" id="btnInstant" aria-label="撮影後すぐ保存">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>即保存
    </button>
    <div class="pill glass static">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="m22 9-6 6M16 9l6 6"/></svg>無音
    </div>
    <button class="pill glass icon" id="btnGrid" aria-label="グリッド">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M9 3v18M15 3v18M3 9h18M3 15h18"/></svg>
    </button>
  </div>

  <div class="toast glass" id="toast"></div>

  <div class="bottomwrap">
    <div class="zoom glass" id="zoom">
      <button data-z="1" class="on">1×</button>
      <button data-z="2">2×</button>
      <button data-z="3">3×</button>
    </div>
    <div class="dock glass">
      <button class="thumb" id="thumb" aria-label="撮影した写真を開く"><span class="badge" id="badge">0</span></button>
      <button class="shutter" id="shutter" aria-label="撮影"><i></i></button>
      <button class="flip" id="flip" aria-label="カメラを切り替え">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-14-4L4 9"/><path d="M4 4v5h5"/><path d="M4 13a8 8 0 0 0 14 4l2-2"/><path d="M20 20v-5h-5"/></svg>
      </button>
    </div>
  </div>
</div>

<!-- 保存シート -->
<div class="sheet" id="sheet">
  <header>
    <button class="link" id="sheetClose">閉じる</button>
    <div class="title" id="sheetTitle">撮影した写真</div>
    <button class="link" id="selAll">すべて選択</button>
  </header>
  <div class="gallery" id="gallery"></div>
  <div class="hint">「保存」→ 共有シートの「画像を保存」で写真アプリに入ります</div>
  <div class="savebar">
    <button id="btnDelete">削除</button>
    <button id="btnSave" class="primary">保存</button>
  </div>
</div>

<div class="preview" id="preview"><img id="previewImg" alt=""></div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const video = $('video'), finder = $('finder');
  let stream = null, facing = 'environment', zoom = 1, shots = [], instant = false, busy = false;

  /* ---------- helpers ---------- */
  let toastTimer;
  function toast(t) {
    const el = $('toast'); el.textContent = t; el.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 1800);
  }
  const pad = n => String(n).padStart(2, '0');
  function fileName() {
    const d = new Date();
    return `IMG_${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}.jpg`;
  }
  function showMsg(t) { const m = $('msg'); m.innerHTML = t; m.classList.add('show'); }

  /* ---------- camera ---------- */
  async function startCamera() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      showMsg('このブラウザではカメラを使えません。<br>HTTPS で開いているか確認してください。'); return;
    }
    if (stream) stream.getTracks().forEach(t => t.stop());
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: { facingMode: { ideal: facing }, width: { ideal: 4032 }, height: { ideal: 3024 } }
      });
      video.srcObject = stream;
      await video.play().catch(() => {});
      $('msg').classList.remove('show');
      video.style.setProperty('--mx', facing === 'user' ? -1 : 1);
    } catch (e) {
      showMsg('カメラを起動できません。<br>ブラウザのカメラ許可を確認してください。<br><small>' + (e.name || '') + '</small>');
    }
  }

  /* ---------- zoom (digital) ---------- */
  function setZoom(z) {
    zoom = Math.max(1, Math.min(5, z));
    video.style.setProperty('--z', zoom);
    document.querySelectorAll('#zoom button').forEach(b => b.classList.toggle('on', Math.abs(+b.dataset.z - zoom) < 0.05));
  }
  $('zoom').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setZoom(+b.dataset.z); });

  let pinch0 = 0, zoom0 = 1;
  const dist = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
  document.addEventListener('touchstart', e => { if (e.touches.length === 2) { pinch0 = dist(e.touches); zoom0 = zoom; } }, { passive: true });
  document.addEventListener('touchmove', e => { if (e.touches.length === 2 && pinch0) setZoom(zoom0 * dist(e.touches) / pinch0); }, { passive: true });
  document.addEventListener('touchend', () => { pinch0 = 0; });

  // tap to focus (visual + best effort)
  document.addEventListener('click', e => {
    if (e.target.closest('button, .zoom, .dock, .sheet, .preview')) return;
    const f = $('focus');
    f.style.left = e.clientX + 'px'; f.style.top = e.clientY + 'px';
    f.classList.remove('go'); void f.offsetWidth; f.classList.add('go');
    const track = stream && stream.getVideoTracks()[0];
    try { track && track.applyConstraints({ advanced: [{ focusMode: 'single-shot' }] }).catch(() => {}); } catch (_) {}
  });

  /* ---------- capture: exactly what the full screen shows ---------- */
  async function shoot() {
    if (busy || !stream || !video.videoWidth) return;
    busy = true;
    try {
      const vw = video.videoWidth, vh = video.videoHeight;
      const cw = finder.clientWidth, ch = finder.clientHeight;   // = screen size
      const scale = Math.max(cw / vw, ch / vh);                  // object-fit: cover
      const sw = cw / scale / zoom, sh = ch / scale / zoom;      // visible area after zoom
      const sx = (vw - sw) / 2, sy = (vh - sh) / 2;
      const c = document.createElement('canvas');
      c.width = Math.round(sw); c.height = Math.round(sh);
      c.getContext('2d').drawImage(video, sx, sy, sw, sh, 0, 0, c.width, c.height);

      const fl = $('flash'); fl.classList.remove('go'); void fl.offsetWidth; fl.classList.add('go');

      const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.95));
      if (!blob) throw new Error('encode');
      const shot = { blob, url: URL.createObjectURL(blob), name: fileName(), sel: true };
      if (shots.some(s => s.name === shot.name)) shot.name = shot.name.replace('.jpg', `_${shots.length}.jpg`);
      shots.push(shot);
      updateThumb();
      if (instant) await saveFiles([shot]); else toast('撮影しました');
    } catch (e) { toast('撮影に失敗しました'); }
    busy = false;
  }
  $('shutter').addEventListener('click', shoot);

  function updateThumb() {
    const t = $('thumb'), last = shots[shots.length - 1];
    t.style.backgroundImage = last ? `url(${last.url})` : 'none';
    t.classList.toggle('has', shots.length > 0);
    $('badge').textContent = shots.length;
  }

  /* ---------- save to Photos (via share sheet) ---------- */
  async function saveFiles(list) {
    if (!list.length) return;
    const files = list.map(s => new File([s.blob], s.name, { type: 'image/jpeg' }));
    if (navigator.canShare && navigator.canShare({ files })) {
      try { await navigator.share({ files }); return; }
      catch (e) { if (e.name === 'AbortError') return; }
    }
    list.forEach(s => { const a = document.createElement('a'); a.href = s.url; a.download = s.name; document.body.appendChild(a); a.click(); a.remove(); });
    toast('ダウンロードしました');
  }

  /* ---------- gallery sheet ---------- */
  function renderGallery() {
    const g = $('gallery'); g.innerHTML = '';
    if (!shots.length) g.innerHTML = '<div class="empty">まだ写真がありません。<br>シャッターを押すとここに溜まります。</div>';
    shots.slice().reverse().forEach(s => {
      const cell = document.createElement('div'); cell.className = 'cell' + (s.sel ? ' sel' : '');
      const img = document.createElement('img'); img.src = s.url; img.alt = s.name;
      img.addEventListener('click', () => { $('previewImg').src = s.url; $('preview').classList.add('show'); });
      const chk = document.createElement('button'); chk.className = 'check'; chk.setAttribute('aria-label', '選択');
      chk.addEventListener('click', ev => { ev.stopPropagation(); s.sel = !s.sel; cell.classList.toggle('sel', s.sel); refreshBar(); });
      cell.append(img, chk); g.appendChild(cell);
    });
    refreshBar();
  }
  function refreshBar() {
    const n = shots.filter(s => s.sel).length;
    $('btnSave').textContent = n ? `保存 (${n})` : '保存';
    $('btnSave').disabled = !n; $('btnDelete').disabled = !n;
    $('selAll').textContent = (shots.length && n === shots.length) ? '選択解除' : 'すべて選択';
    $('sheetTitle').textContent = `撮影した写真 ${shots.length}枚`;
  }
  $('thumb').addEventListener('click', () => { renderGallery(); $('sheet').classList.add('show'); });
  $('sheetClose').addEventListener('click', () => $('sheet').classList.remove('show'));
  $('preview').addEventListener('click', () => $('preview').classList.remove('show'));
  $('selAll').addEventListener('click', () => {
    const all = shots.length && shots.every(s => s.sel);
    shots.forEach(s => s.sel = !all); renderGallery();
  });
  $('btnSave').addEventListener('click', () => saveFiles(shots.filter(s => s.sel)));
  $('btnDelete').addEventListener('click', () => {
    shots.filter(s => s.sel).forEach(s => URL.revokeObjectURL(s.url));
    shots = shots.filter(s => !s.sel); updateThumb(); renderGallery();
  });

  /* ---------- toggles ---------- */
  $('btnGrid').addEventListener('click', e => { e.currentTarget.classList.toggle('on'); $('grid').classList.toggle('on'); });
  $('btnInstant').addEventListener('click', e => {
    instant = !instant; e.currentTarget.classList.toggle('on', instant);
    toast(instant ? '即保存：撮影のたびに保存画面を開きます' : '即保存 オフ');
  });
  $('flip').addEventListener('click', e => {
    e.currentTarget.classList.toggle('spin');
    facing = facing === 'environment' ? 'user' : 'environment'; setZoom(1); startCamera();
  });

  document.addEventListener('keydown', e => { if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); shoot(); } });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') {
      const t = stream && stream.getVideoTracks()[0];
      if (!t || t.readyState === 'ended') startCamera();
    }
  });
  document.addEventListener('gesturestart', e => e.preventDefault());

  startCamera();
})();
</script>
</body>
</html>
