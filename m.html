<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>カメラ</title>
<style>
  :root { --yellow:#ffd60a; --ui:#1c1c1e; --ui2:#2c2c2e; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  html, body { margin:0; height:100%; background:#000; color:#fff; overflow:hidden; overscroll-behavior:none;
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Hiragino Sans", "Noto Sans JP", sans-serif; }
  button { font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; }

  #app { position:fixed; inset:0; display:flex; flex-direction:column;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }

  /* ---- top bar ---- */
  .top { flex:0 0 52px; display:flex; align-items:center; justify-content:space-between; padding:0 18px; }
  .chip { height:34px; min-width:34px; padding:0 12px; border-radius:17px; background:rgba(255,255,255,.14);
    display:flex; align-items:center; justify-content:center; gap:6px; font-size:13px; font-weight:600; transition:background .2s,color .2s; }
  .chip.on { background:var(--yellow); color:#000; }
  .chip svg { width:18px; height:18px; }

  /* ---- viewfinder ---- */
  .finder { position:relative; flex:1 1 auto; min-height:0; overflow:hidden; background:#111; border-radius:14px; margin:0 0; }
  video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transform-origin:center;
    transform:scaleX(var(--mx,1)) scale(var(--z,1)); }
  .grid { position:absolute; inset:0; pointer-events:none; opacity:0; transition:opacity .2s;
    background:
      linear-gradient(to right, transparent calc(33.33% - .5px), rgba(255,255,255,.4) calc(33.33% - .5px), rgba(255,255,255,.4) calc(33.33% + .5px), transparent calc(33.33% + .5px), transparent calc(66.66% - .5px), rgba(255,255,255,.4) calc(66.66% - .5px), rgba(255,255,255,.4) calc(66.66% + .5px), transparent calc(66.66% + .5px)),
      linear-gradient(to bottom, transparent calc(33.33% - .5px), rgba(255,255,255,.4) calc(33.33% - .5px), rgba(255,255,255,.4) calc(33.33% + .5px), transparent calc(33.33% + .5px), transparent calc(66.66% - .5px), rgba(255,255,255,.4) calc(66.66% - .5px), rgba(255,255,255,.4) calc(66.66% + .5px), transparent calc(66.66% + .5px)); }
  .grid.on { opacity:1; }
  .flash { position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; }
  .flash.go { animation:blink .28s ease-out; }
  @keyframes blink { 0%{opacity:.85} 100%{opacity:0} }

  .focus { position:absolute; width:76px; height:76px; border:1.5px solid var(--yellow); pointer-events:none; opacity:0;
    transform:translate(-50%,-50%) scale(1.4); }
  .focus::before, .focus::after { content:""; position:absolute; background:var(--yellow); }
  .focus::before { left:50%; top:0; width:1.5px; height:7px; transform:translateX(-50%); }
  .focus::after { top:50%; left:0; height:1.5px; width:7px; transform:translateY(-50%); }
  .focus.go { animation:focus 1.1s ease-out; }
  @keyframes focus { 0%{opacity:0; transform:translate(-50%,-50%) scale(1.4)} 15%{opacity:1; transform:translate(-50%,-50%) scale(1)} 80%{opacity:1} 100%{opacity:0; transform:translate(-50%,-50%) scale(1)} }

  .zoom { position:absolute; left:50%; bottom:14px; transform:translateX(-50%); display:flex; gap:6px; padding:5px;
    border-radius:26px; background:rgba(0,0,0,.35); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); }
  .zoom button { width:36px; height:36px; border-radius:50%; font-size:12px; font-weight:600; transition:all .2s; }
  .zoom button.on { background:rgba(0,0,0,.55); color:var(--yellow); width:42px; height:42px; margin:-3px 0; font-size:14px; }

  .toast { position:absolute; left:50%; top:14px; transform:translate(-50%,-8px); padding:8px 14px; border-radius:16px;
    background:rgba(28,28,30,.85); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); font-size:13px; opacity:0;
    transition:opacity .25s, transform .25s; pointer-events:none; white-space:nowrap; z-index:5; }
  .toast.show { opacity:1; transform:translate(-50%,0); }

  .msg { position:absolute; inset:0; display:none; align-items:center; justify-content:center; text-align:center; padding:32px;
    font-size:14px; line-height:1.7; color:#c7c7cc; background:#111; z-index:4; }
  .msg.show { display:flex; }

  /* ---- bottom controls ---- */
  .bottom { flex:0 0 176px; position:relative; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; padding-top:14px; }
  .mode { font-size:14px; font-weight:600; color:var(--yellow); letter-spacing:.02em; height:20px; }
  .row { width:100%; flex:1; display:flex; align-items:center; justify-content:space-between; padding:0 34px; }
  .thumb { width:56px; height:56px; border-radius:10px; background:var(--ui) center/cover no-repeat; border:1.5px solid rgba(255,255,255,.35); position:relative; }
  .thumb .badge { position:absolute; right:-7px; top:-7px; min-width:20px; height:20px; border-radius:10px; padding:0 5px;
    background:var(--yellow); color:#000; font-size:12px; font-weight:700; display:none; align-items:center; justify-content:center; }
  .thumb.has .badge { display:flex; }
  .shutter { width:78px; height:78px; border-radius:50%; border:4px solid #fff; display:flex; align-items:center; justify-content:center; }
  .shutter i { display:block; width:62px; height:62px; border-radius:50%; background:#fff; transition:transform .09s ease-out, background .09s; }
  .shutter:active i { transform:scale(.86); background:#d8d8d8; }
  .flip { width:56px; height:56px; border-radius:50%; background:var(--ui2); display:flex; align-items:center; justify-content:center; }
  .flip svg { width:26px; height:26px; transition:transform .4s; }
  .flip.spin svg { transform:rotate(180deg); }

  /* ---- gallery / save sheet ---- */
  .sheet { position:fixed; inset:0; background:#000; z-index:20; display:none; flex-direction:column;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
  .sheet.show { display:flex; }
  .sheet header { flex:0 0 52px; display:flex; align-items:center; justify-content:space-between; padding:0 16px; }
  .sheet header .title { font-weight:600; font-size:16px; }
  .link { color:var(--yellow); font-size:16px; padding:8px 4px; }
  .link[disabled] { color:#636366; }
  .gallery { flex:1; overflow-y:auto; display:grid; grid-template-columns:repeat(3,1fr); gap:2px; align-content:start; -webkit-overflow-scrolling:touch; }
  .cell { position:relative; aspect-ratio:1; background:#111; }
  .cell img { width:100%; height:100%; object-fit:cover; display:block; }
  .cell .check { position:absolute; right:6px; top:6px; width:26px; height:26px; border-radius:50%; border:2px solid #fff;
    background:rgba(0,0,0,.35); display:flex; align-items:center; justify-content:center; }
  .cell.sel .check { background:var(--yellow); border-color:var(--yellow); }
  .cell.sel .check::after { content:""; width:6px; height:11px; border:solid #000; border-width:0 2.5px 2.5px 0; transform:rotate(45deg) translate(-1px,-1px); }
  .empty { grid-column:1/-1; text-align:center; color:#8e8e93; padding:80px 24px; font-size:14px; line-height:1.7; }
  .savebar { flex:0 0 auto; padding:10px 16px 12px; display:flex; gap:10px; }
  .savebar button { flex:1; height:50px; border-radius:14px; font-weight:600; font-size:16px; background:var(--ui2); }
  .savebar button.primary { background:var(--yellow); color:#000; }
  .savebar button[disabled] { opacity:.4; }
  .hint { text-align:center; color:#8e8e93; font-size:12px; padding:0 16px 8px; line-height:1.6; }

  .preview { position:fixed; inset:0; background:#000; z-index:30; display:none; align-items:center; justify-content:center; }
  .preview.show { display:flex; }
  .preview img { max-width:100%; max-height:100%; -webkit-touch-callout:default; -webkit-user-select:auto; user-select:auto; }
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <button class="chip" id="btnInstant" aria-label="撮影後すぐ保存">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>即保存
    </button>
    <div style="font-size:12px;color:#8e8e93">無音</div>
    <button class="chip" id="btnGrid" aria-label="グリッド">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18M15 3v18M3 9h18M3 15h18"/></svg>
    </button>
  </div>

  <div class="finder" id="finder">
    <video id="video" autoplay playsinline muted></video>
    <div class="grid" id="grid"></div>
    <div class="flash" id="flash"></div>
    <div class="focus" id="focus"></div>
    <div class="toast" id="toast"></div>
    <div class="zoom" id="zoom">
      <button data-z="1" class="on">1×</button>
      <button data-z="2">2×</button>
      <button data-z="3">3×</button>
    </div>
    <div class="msg" id="msg"></div>
  </div>

  <div class="bottom">
    <div class="mode">写真</div>
    <div class="row">
      <button class="thumb" id="thumb" aria-label="撮影した写真を開く"><span class="badge" id="badge">0</span></button>
      <button class="shutter" id="shutter" aria-label="撮影"><i></i></button>
      <button class="flip" id="flip" aria-label="カメラを切り替え">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-14-4L4 9"/><path d="M4 4v5h5"/><path d="M4 13a8 8 0 0 0 14 4l2-2"/><path d="M20 20v-5h-5"/></svg>
      </button>
    </div>
  </div>
</div>

<!-- 保存シート -->
<div class="sheet" id="sheet">
  <header>
    <button class="link" id="sheetClose">閉じる</button>
    <div class="title" id="sheetTitle">撮影した写真</div>
    <button class="link" id="selAll">すべて選択</button>
  </header>
  <div class="gallery" id="gallery"></div>
  <div class="hint">「保存」→ 共有シートの「画像を保存」で写真アプリに入ります</div>
  <div class="savebar">
    <button id="btnDelete">削除</button>
    <button id="btnSave" class="primary">保存</button>
  </div>
</div>

<div class="preview" id="preview"><img id="previewImg" alt=""></div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const video = $('video'), finder = $('finder');
  let stream = null, facing = 'environment', zoom = 1, shots = [], instant = false, busy = false;

  /* ---------- helpers ---------- */
  let toastTimer;
  function toast(t) {
    const el = $('toast'); el.textContent = t; el.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 1800);
  }
  const pad = n => String(n).padStart(2, '0');
  function fileName() {
    const d = new Date();
    return `IMG_${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}.jpg`;
  }
  function showMsg(t) { const m = $('msg'); m.innerHTML = t; m.classList.add('show'); }

  /* ---------- camera ---------- */
  async function startCamera() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      showMsg('このブラウザではカメラを使えません。<br>HTTPS で開いているか確認してください。'); return;
    }
    if (stream) stream.getTracks().forEach(t => t.stop());
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: { facingMode: { ideal: facing }, width: { ideal: 4032 }, height: { ideal: 3024 } }
      });
      video.srcObject = stream;
      await video.play().catch(() => {});
      $('msg').classList.remove('show');
      video.style.setProperty('--mx', facing === 'user' ? -1 : 1);
    } catch (e) {
      showMsg('カメラを起動できません。<br>ブラウザのカメラ許可を確認してください。<br><small>' + (e.name || '') + '</small>');
    }
  }

  /* ---------- zoom (digital) ---------- */
  function setZoom(z) {
    zoom = Math.max(1, Math.min(5, z));
    video.style.setProperty('--z', zoom);
    document.querySelectorAll('#zoom button').forEach(b => b.classList.toggle('on', Math.abs(+b.dataset.z - zoom) < 0.05));
  }
  $('zoom').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setZoom(+b.dataset.z); });

  // pinch zoom
  let pinch0 = 0, zoom0 = 1;
  const dist = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
  finder.addEventListener('touchstart', e => { if (e.touches.length === 2) { pinch0 = dist(e.touches); zoom0 = zoom; } }, { passive: true });
  finder.addEventListener('touchmove', e => { if (e.touches.length === 2 && pinch0) setZoom(zoom0 * dist(e.touches) / pinch0); }, { passive: true });
  finder.addEventListener('touchend', () => { pinch0 = 0; });

  // tap to focus (visual + best effort)
  finder.addEventListener('click', e => {
    if (e.target.closest('.zoom')) return;
    const r = finder.getBoundingClientRect(), f = $('focus');
    f.style.left = (e.clientX - r.left) + 'px'; f.style.top = (e.clientY - r.top) + 'px';
    f.classList.remove('go'); void f.offsetWidth; f.classList.add('go');
    const track = stream && stream.getVideoTracks()[0];
    try { track && track.applyConstraints({ advanced: [{ focusMode: 'single-shot' }] }).catch(() => {}); } catch (_) {}
  });

  /* ---------- capture (silent: draws a video frame to canvas) ---------- */
  async function shoot() {
    if (busy || !stream || !video.videoWidth) return;
    busy = true;
    try {
      const vw = video.videoWidth, vh = video.videoHeight;
      const cw = finder.clientWidth, ch = finder.clientHeight;
      // area visible with object-fit: cover, then digital zoom crop (WYSIWYG)
      const scale = Math.max(cw / vw, ch / vh);
      let sw = cw / scale / zoom, sh = ch / scale / zoom;
      const sx = (vw - sw) / 2, sy = (vh - sh) / 2;
      const c = document.createElement('canvas');
      c.width = Math.round(sw); c.height = Math.round(sh);
      c.getContext('2d').drawImage(video, sx, sy, sw, sh, 0, 0, c.width, c.height);

      const fl = $('flash'); fl.classList.remove('go'); void fl.offsetWidth; fl.classList.add('go');
      if (navigator.vibrate) navigator.vibrate(0);

      const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.95));
      if (!blob) throw new Error('encode');
      const shot = { blob, url: URL.createObjectURL(blob), name: fileName(), sel: true };
      // avoid duplicate names if shooting more than once per second
      if (shots.some(s => s.name === shot.name)) shot.name = shot.name.replace('.jpg', `_${shots.length}.jpg`);
      shots.push(shot);
      updateThumb();
      if (instant) await saveFiles([shot]); else toast('撮影しました');
    } catch (e) { toast('撮影に失敗しました'); }
    busy = false;
  }
  $('shutter').addEventListener('click', shoot);

  function updateThumb() {
    const t = $('thumb'), last = shots[shots.length - 1];
    t.style.backgroundImage = last ? `url(${last.url})` : 'none';
    t.classList.toggle('has', shots.length > 0);
    $('badge').textContent = shots.length;
  }

  /* ---------- save to Photos (via share sheet) ---------- */
  async function saveFiles(list) {
    if (!list.length) return;
    const files = list.map(s => new File([s.blob], s.name, { type: 'image/jpeg' }));
    if (navigator.canShare && navigator.canShare({ files })) {
      try { await navigator.share({ files }); return; }
      catch (e) { if (e.name === 'AbortError') return; }
    }
    // fallback: download (or long-press the preview image → 「“写真”に追加」)
    list.forEach(s => { const a = document.createElement('a'); a.href = s.url; a.download = s.name; document.body.appendChild(a); a.click(); a.remove(); });
    toast('ダウンロードしました');
  }

  /* ---------- gallery sheet ---------- */
  function renderGallery() {
    const g = $('gallery'); g.innerHTML = '';
    if (!shots.length) {
      g.innerHTML = '<div class="empty">まだ写真がありません。<br>シャッターを押すとここに溜まります。</div>';
    }
    shots.slice().reverse().forEach(s => {
      const cell = document.createElement('div'); cell.className = 'cell' + (s.sel ? ' sel' : '');
      const img = document.createElement('img'); img.src = s.url; img.alt = s.name;
      img.addEventListener('click', () => { $('previewImg').src = s.url; $('preview').classList.add('show'); });
      const chk = document.createElement('button'); chk.className = 'check'; chk.setAttribute('aria-label', '選択');
      chk.addEventListener('click', ev => { ev.stopPropagation(); s.sel = !s.sel; cell.classList.toggle('sel', s.sel); refreshBar(); });
      cell.append(img, chk); g.appendChild(cell);
    });
    refreshBar();
  }
  function refreshBar() {
    const n = shots.filter(s => s.sel).length;
    $('btnSave').textContent = n ? `保存 (${n})` : '保存';
    $('btnSave').disabled = !n; $('btnDelete').disabled = !n;
    $('selAll').textContent = (shots.length && n === shots.length) ? '選択解除' : 'すべて選択';
    $('sheetTitle').textContent = `撮影した写真 ${shots.length}枚`;
  }
  $('thumb').addEventListener('click', () => { renderGallery(); $('sheet').classList.add('show'); });
  $('sheetClose').addEventListener('click', () => $('sheet').classList.remove('show'));
  $('preview').addEventListener('click', () => $('preview').classList.remove('show'));
  $('selAll').addEventListener('click', () => {
    const all = shots.length && shots.every(s => s.sel);
    shots.forEach(s => s.sel = !all); renderGallery();
  });
  $('btnSave').addEventListener('click', () => saveFiles(shots.filter(s => s.sel)));
  $('btnDelete').addEventListener('click', () => {
    shots.filter(s => s.sel).forEach(s => URL.revokeObjectURL(s.url));
    shots = shots.filter(s => !s.sel); updateThumb(); renderGallery();
  });

  /* ---------- toggles ---------- */
  $('btnGrid').addEventListener('click', e => { e.currentTarget.classList.toggle('on'); $('grid').classList.toggle('on'); });
  $('btnInstant').addEventListener('click', e => {
    instant = !instant; e.currentTarget.classList.toggle('on', instant);
    toast(instant ? '即保存：撮影のたびに保存画面を開きます' : '即保存 オフ');
  });
  $('flip').addEventListener('click', e => {
    e.currentTarget.classList.toggle('spin');
    facing = facing === 'environment' ? 'user' : 'environment'; setZoom(1); startCamera();
  });

  // volume buttons can't be used in the browser, but Enter/Space works with keyboards
  document.addEventListener('keydown', e => { if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); shoot(); } });

  // resume camera when coming back to the tab
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') {
      const t = stream && stream.getVideoTracks()[0];
      if (!t || t.readyState === 'ended') startCamera();
    }
  });

  // block double-tap zoom / bounce
  document.addEventListener('gesturestart', e => e.preventDefault());

  startCamera();
})();
</script>
</body>
</html>
